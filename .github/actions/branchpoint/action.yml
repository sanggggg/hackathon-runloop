name: Branchpoint
description: Evaluate a commit against an agent-driven QA suite and comment the verdict on the PR.

inputs:
  suite:
    description: Suite id to evaluate.
    required: true
  token:
    description: Branchpoint API token. Store it as a repository secret.
    required: true
  ref:
    description: Commit to evaluate. Defaults to the commit that triggered the workflow.
    required: false
    default: ""
  api:
    description: Service base url. Use "fixture" to try the action without a service.
    required: false
    default: https://api.branchpoint.dev
  comment:
    description: Post the verdict as a pull request comment.
    required: false
    default: "true"
  strict-ui:
    description: Also fail when the agent had to follow a UI change.
    required: false
    default: "false"
  github-token:
    description: Token used to write the pull request comment.
    required: false
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    # Nothing to install: the evaluation happens on the service, so the runner
    # never needs a browser or any test dependency.
    # The CLI is not on npm yet, so it is fetched from source. Once it is
    # published this becomes `npx --yes @branchpoint/cli`.
    - name: Fetch the CLI
      shell: bash
      run: |
        git clone --depth 1 --filter=blob:none --sparse \
          https://github.com/sanggggg/hackathon-runloop.git "$RUNNER_TEMP/branchpoint"
        git -C "$RUNNER_TEMP/branchpoint" sparse-checkout set apps/cli packages/schema

    - name: Evaluate
      id: evaluate
      shell: bash
      env:
        BRANCHPOINT_TOKEN: ${{ inputs.token }}
        BRANCHPOINT_API: ${{ inputs.api }}
      run: |
        set +e
        CLI="node --experimental-strip-types $RUNNER_TEMP/branchpoint/apps/cli/src/index.ts"
        REF="${{ inputs.ref }}"; [ -z "$REF" ] && REF="${{ github.sha }}"
        ARGS=(run --suite "${{ inputs.suite }}" --ref "$REF" --wait)
        [ "${{ inputs.strict-ui }}" = "true" ] && ARGS+=(--strict-ui)

        # One evaluation, rendered twice. The run id is reused so the service is
        # not asked to fork everything a second time.
        $CLI "${ARGS[@]}" > summary.txt
        CODE=$?
        RUN_ID=$($CLI runs --suite "${{ inputs.suite }}" --format json | node -e \
          'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>console.log(JSON.parse(d)[0].id))')
        $CLI show "$RUN_ID" --format markdown > verdict.md

        cat summary.txt >> "$GITHUB_STEP_SUMMARY"
        cat summary.txt
        echo "code=$CODE" >> "$GITHUB_OUTPUT"
        exit 0

    - name: Comment on the pull request
      if: ${{ inputs.comment == 'true' && github.event_name == 'pull_request' }}
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
      run: |
        # One comment per PR, edited in place, so the thread does not fill up.
        gh pr comment "${{ github.event.pull_request.number }}" \
          --body-file verdict.md --edit-last --create-if-none

    - name: Report the verdict
      shell: bash
      run: |
        case "${{ steps.evaluate.outputs.code }}" in
          0) echo "All paths passed." ;;
          1) echo "::error::A path failed — the app changed in a way the suite did not expect."; exit 1 ;;
          2) echo "::error::A step matched nothing on the page. The suite is stale, not the app."; exit 1 ;;
          *) echo "::error::The run could not be started."; exit 1 ;;
        esac
